<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Electro">
  <meta name="format-detection" content="telephone=no">
  <title>{% block title %}Electro — Personal Meter Dashboard{% endblock %}</title>

  <!-- Prevent theme flicker (FOUC) before DOM render -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('electro_theme');
        var isDark = saved ? saved === 'dark' : true;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', '#f8fafc');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.3.1">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#090d16] dark:text-slate-100 min-h-screen flex flex-col font-sans selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300 antialiased transition-colors duration-200">
  <!-- Top Navigation / Real-time Status Header -->
  <header class="border-b border-slate-200/80 dark:border-slate-800/80 bg-white/90 dark:bg-[#090d16]/90 backdrop-blur-xl sticky top-0 z-40 transition-colors pt-safe">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex items-center justify-between gap-2.5">
      
      <!-- Brand & Title -->
      <div class="flex items-center space-x-2.5 sm:space-x-3">
        <div class="h-8 w-8 rounded-xl bg-gradient-to-br from-emerald-400/20 via-emerald-500/10 to-teal-500/5 text-emerald-600 dark:text-emerald-400 flex items-center justify-center border border-emerald-500/30 shadow-sm shrink-0">
          <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5 sm:gap-2">
            <h1 class="text-sm sm:text-base font-bold tracking-tight text-slate-900 dark:text-white leading-none">Electro</h1>
            <span class="text-[9px] sm:text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-200/80 dark:bg-slate-800/80 text-slate-600 dark:text-slate-400 border border-slate-300/80 dark:border-slate-700/60 leading-none">v1.2</span>
          </div>
          <p class="hidden xs:block sm:block text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 font-medium">Meter Dashboard</p>
        </div>
      </div>

      <!-- Desktop Segmented Navigation Tabs (Sticky Top Bar) -->
      <nav class="hidden md:inline-flex items-center p-1 rounded-xl bg-slate-100 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800/80 shadow-inner gap-1" aria-label="Dashboard Views">
        <!-- Overview Tab -->
        <button type="button" id="tab-overview" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all bg-white dark:bg-slate-800/90 text-slate-900 dark:text-white shadow-sm border border-slate-200 dark:border-slate-700/60" data-view="overview">
          <svg class="w-3.5 h-3.5 text-emerald-600 dark:text-emerald-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
          </svg>
          <span>Overview</span>
          <kbd class="hidden lg:inline-block ml-0.5 px-1 py-0.2 text-[9px] font-mono text-slate-400 dark:text-slate-500 rounded bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800">1</kbd>
        </button>

        <!-- Analytics Tab -->
        <button type="button" id="tab-analytics" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-800/40 border border-transparent" data-view="analytics">
          <svg class="w-3.5 h-3.5 text-cyan-600 dark:text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/>
          </svg>
          <span>Analytics</span>
          <kbd class="hidden lg:inline-block ml-0.5 px-1 py-0.2 text-[9px] font-mono text-slate-400 dark:text-slate-500 rounded bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800">2</kbd>
        </button>

        <!-- Supply Tab -->
        <button type="button" id="tab-supply" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-800/40 border border-transparent" data-view="supply">
          <svg class="w-3.5 h-3.5 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span>Supply</span>
          <kbd class="hidden lg:inline-block ml-0.5 px-1 py-0.2 text-[9px] font-mono text-slate-400 dark:text-slate-500 rounded bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800">3</kbd>
        </button>

        <!-- History / Events Tab -->
        <button type="button" id="tab-history" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-800/40 border border-transparent" data-view="history">
          <svg class="w-3.5 h-3.5 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Events</span>
          <span id="events-count-badge" class="ml-0.5 text-[10px] font-mono px-1.5 py-0.2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700/80">0</span>
          <kbd class="hidden lg:inline-block ml-0.5 px-1 py-0.2 text-[9px] font-mono text-slate-400 dark:text-slate-500 rounded bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800">4</kbd>
        </button>
      </nav>

      <!-- Live Status Beacon, Meter ID, Theme Switcher & Manual Refresh -->
      <div class="flex items-center space-x-2 sm:space-x-2.5">
        <!-- Live Connection Pill -->
        <div class="flex items-center px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800/80 text-[11px] sm:text-xs shadow-sm">
          <span id="connection-dot" class="h-2 w-2 rounded-full bg-slate-400 dark:bg-slate-500 mr-2 sm:mr-2.5 animate-pulse shrink-0"></span>
          <span id="connection-text" class="text-slate-700 dark:text-slate-300 font-medium tracking-tight whitespace-nowrap">Checking status...</span>
        </div>

        <!-- Meter ID Pill (Desktop) -->
        <div class="hidden xl:flex items-center px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800/80 text-[11px] text-slate-500 dark:text-slate-400 font-mono shadow-sm">
          <span class="mr-1 text-slate-400 dark:text-slate-500">Meter:</span>
          <span id="meter-id-label" class="text-slate-800 dark:text-slate-200 font-bold">--</span>
        </div>

        <!-- Theme Toggle Button (Light / Dark) -->
        <button id="theme-toggle-btn" type="button" title="Toggle Light / Dark mode (Shortcut: T)" aria-label="Toggle visual theme" class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-white dark:bg-slate-900/90 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition-all shadow-sm active:scale-95 focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
          <!-- Sun Icon (visible in dark mode) -->
          <svg id="theme-icon-sun" class="w-4 h-4 hidden dark:block text-amber-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- Moon Icon (visible in light mode) -->
          <svg id="theme-icon-moon" class="w-4 h-4 block dark:hidden text-slate-700 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <span class="sr-only">Toggle Theme</span>
        </button>

        <!-- Manual Refresh Action (Icon Button) -->
        <button id="refresh-btn" type="button" title="Refresh reading from upstream meter (Shortcut: R)" aria-label="Refresh telemetry reading" class="inline-flex items-center justify-center h-8 w-8 rounded-lg bg-white dark:bg-slate-900/90 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition-all shadow-sm active:scale-95 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 disabled:opacity-50 disabled:cursor-not-allowed">
          <svg id="refresh-icon" class="w-4 h-4 transition-transform shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          <span id="refresh-label" class="sr-only">Refresh Now</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Container (pb-24 on mobile prevents bottom dock from covering content) -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 pb-24 md:pb-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Modern Minimalist Footer (pb-20 on mobile for dock clearance) -->
  <footer class="border-t border-slate-200 dark:border-slate-800/60 bg-slate-100/90 dark:bg-[#070b13] py-4 pb-20 md:pb-4 mt-auto text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px]">
      <p class="text-slate-600 dark:text-slate-400">
        Personal Meter Dashboard · Single-user telemetry monitoring
      </p>
      <p class="text-slate-500 font-mono">
        Network service (<code class="text-slate-600 dark:text-slate-400">{{ request.host }}</code>)
      </p>
    </div>
  </footer>

  <!-- Native App-Style Mobile Bottom Navigation Dock -->
  <nav id="mobile-dock" class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-white/95 dark:bg-[#090d16]/95 backdrop-blur-2xl border-t border-slate-200 dark:border-slate-800/90 px-2.5 py-1.5 pb-safe shadow-2xl transition-all" aria-label="Mobile Navigation">
    <div class="max-w-md mx-auto grid grid-cols-4 gap-1">
      <button type="button" class="mobile-tab-btn flex flex-col items-center justify-center py-1.5 px-2 rounded-xl text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/25 transition-all active:scale-95 text-[11px] font-bold" data-view="overview">
        <svg class="w-4 h-4 mb-0.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
        </svg>
        <span>Overview</span>
      </button>
      <button type="button" class="mobile-tab-btn flex flex-col items-center justify-center py-1.5 px-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-all active:scale-95 text-[11px] font-medium border border-transparent" data-view="analytics">
        <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/>
        </svg>
        <span>Analytics</span>
      </button>
      <button type="button" class="mobile-tab-btn flex flex-col items-center justify-center py-1.5 px-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-all active:scale-95 text-[11px] font-medium border border-transparent" data-view="supply">
        <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span>Supply</span>
      </button>
      <button type="button" class="mobile-tab-btn relative flex flex-col items-center justify-center py-1.5 px-2 rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-all active:scale-95 text-[11px] font-medium border border-transparent" data-view="history">
        <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>Events</span>
        <span id="mobile-events-badge" class="hidden absolute top-1 right-2.5 text-[9px] font-mono px-1 rounded-full bg-emerald-600 dark:bg-emerald-500 text-white dark:text-slate-950 font-bold leading-none py-0.5">0</span>
      </button>
    </div>
  </nav>

  <script>window.__ELECTRO_API_TOKEN__ = {{ (api_token|default('', true)) | tojson }};</script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}?v=1.7.2"></script>
</body>
</html>
