[package]
name = "electro"
version = "0.1.0"
edition = "2024"
authors = ["Gaurav Singh"]
description = "Fast, standalone CLI and agentic tool for Electro electricity meter telemetry"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
toml = "0.8"
